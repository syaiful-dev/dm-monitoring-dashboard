name: CI

# Runs on every push and pull request to main. Verifies the app installs,
# lints clean, and actually boots + serves (smoke test). Runs in CSV mode so it
# NEVER touches a production database.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint & smoke test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    env:
      # Force the safe data source for CI — bundled sample CSVs, no DB access.
      TREND_SOURCE: csv
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Smoke test (boot server + hit endpoints)
        run: npm run smoke
