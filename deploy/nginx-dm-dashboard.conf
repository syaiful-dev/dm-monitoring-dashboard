# nginx site for the DM Monitoring Dashboard.
# Install:  sudo cp deploy/nginx-dm-dashboard.conf /etc/nginx/sites-available/dm-dashboard
#           sudo ln -s /etc/nginx/sites-available/dm-dashboard /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# Replace server_name and the certificate paths first.

# Login brute-force limit (the app also locks an IP after 5 failures).
limit_req_zone $binary_remote_addr zone=dm_login:10m rate=10r/m;

server {
    listen 80;
    server_name dm-dashboard.yourcompany.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dm-dashboard.yourcompany.local;

    ssl_certificate     /etc/ssl/certs/dm-dashboard.crt;
    ssl_certificate_key /etc/ssl/private/dm-dashboard.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    client_max_body_size 2m;

    location = /auth/login {
        limit_req zone=dm_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
